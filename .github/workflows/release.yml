name: Release

# Maintainer-only preparation. Select an existing v<package.json version> tag.
# Commits and tags never publish a release; inspect the draft before manual publication.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # A draft is not found by `gh release view`, so look for the tag in the list. A re-run keeps the release it already has.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null | grep -Fx false; then
            echo "Refusing to overwrite an already published release."
            exit 1
          fi
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -Fx "$GITHUB_REF_NAME" > /dev/null \
            || gh release create "$GITHUB_REF_NAME" --title "ai-ping $GITHUB_REF_NAME" --generate-notes --draft

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:helper
      - run: npm test
      - run: npm run test:codex
      - run: npm run dist
      - name: Upload the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "release/ai-ping-Setup-${GITHUB_REF_NAME#v}.exe" \
            --clobber

  mac:
    needs: release
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:helper
      - run: npm test
      - run: npm run test:codex
      - run: npm run dist:mac
      - run: codesign --verify --deep --strict "release/mac-arm64/ai-ping.app"
      - name: Upload the disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "release/ai-ping-${GITHUB_REF_NAME#v}-arm64.dmg" --clobber
